services:
  api_gateway:
    container_name: api
    image: "api"
    build:
      context: "./api"
      dockerfile: Dockerfile
    env_file: ./backend.env
    environment:
      - Enviroment=Development
    networks:
      - gofre-network
    ports:
      - "8080:50728"
    restart: on-failure
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Gofre"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Gofre
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./docker/DEV/postgres/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/DEV/postgres/data:/var/lib/postgresql
    networks:
      - gofre-network

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: geuberlu@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "81:80"
    networks:
      - gofre-network

networks:
  gofre-network:
    driver: bridge
