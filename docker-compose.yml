name: gofre-stack
services:
  api_gateway:
    container_name: api_gateway
    image: "api_gateway"
    build:
      context: "./backend/api-gateway"
      dockerfile: Dockerfile
    env_file:
      - ./backend.env
    networks:
      - gofre-network
    ports:
      - "8080:80"
    restart: on-failure
    depends_on:
      - auth
      - transactions
      - investments

  auth:
    container_name: auth_microservice
    image: "auth-microservice"
    build:
      context: "./backend/services/auth"
      dockerfile: Dockerfile
    env_file:
      - ./backend.env
    restart: on-failure
    networks:
      - gofre-network
    depends_on:
      - database

  transactions:
    container_name: transaction_microservice
    image: "transactions-microservice"
    build:
      context: "./backend/services/transactions"
      dockerfile: Dockerfile
    env_file:
      - ./backend.env
    restart: on-failure
    networks:
      - gofre-network
    depends_on:
      - database

  reports:
    container_name: reports_microservice
    image: "reports-microservice"
    build:
      context: "./backend/services/reports"
      dockerfile: Dockerfile
    env_file:
      - ./backend.env
    restart: on-failure
    networks:
      - gofre-network
    depends_on:
      - database
      - nats
  investments:
    container_name: investments_microservice
    image: "investments-microservice"
    build:
      context: "./backend/services/investments"
      dockerfile: Dockerfile
    env_file:
      - ./backend.env
    restart: on-failure
    networks:
      - gofre-network
    depends_on:
      - database

  database:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: Gofre
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/data:/var/lib/postgresql
    networks:
      - gofre-network
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: geuberlu@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - "81:80"
    networks:
      - gofre-network

networks:
  gofre-network:
    driver: bridge
